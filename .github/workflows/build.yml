name: Build Poppy Playtime PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Extrair os zips
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z"
          done

      - name: Criar script de build
        run: |
          cat > build.sh <<'EOF'
          set -e
          : "${PS3DEV:=/usr/local/ps3dev}"; export PS3DEV
          export PSL1GHT="$PS3DEV"
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"

          mkdir -p src data/native_assets

          # Ativos otimizados (se vieram do zip)
          D=$(find . -maxdepth 3 -type d -name factory_portable_opt | head -1)
          if [ -n "$D" ]; then cp -r "$D"/. data/native_assets/; fi
          L=$(find . -maxdepth 3 -type f -name factory_fluid_loader.c | head -1)
          if [ -n "$L" ] && [ ! -f src/factory_fluid_loader.c ]; then cp "$L" src/factory_fluid_loader.c; fi

          # main.c minimo de diagnostico (so cria se nao existir)
          if [ ! -f "src/main.c" ]; then
            cat > src/main.c <<'MAIN_EOF'
