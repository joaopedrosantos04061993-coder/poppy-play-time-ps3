name: Build PS3 PKG from ZIP

on:
  workflow_dispatch:

concurrency:
  group: ps3-zip-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "x86_64"
          sudo apt-get update
          sudo apt-get install -y python3 unzip zip curl ca-certificates

      - name: Extract project ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')"
          test -n "$ZIP_FILE"
          rm -rf /tmp/poppy-source
          unzip -q "$ZIP_FILE" -d /tmp/poppy-source
          PROJECT="$(find /tmp/poppy-source -maxdepth 2 -type f -name Makefile -printf '%h\n' | head -n1)"
          test -n "$PROJECT"
          test -f "$PROJECT/source/main.c"
          grep -q '^main.o:' "$PROJECT/Makefile"
          grep -q -- '-I\$(CURDIR)' "$PROJECT/Makefile"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install complete PS3DEV SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /opt/ps3dev
          sudo chown "$USER:$USER" /opt/ps3dev
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/ps3dev.tar.gz \
            https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-11-16/ps3dev-linux-X64.tar.gz
          echo '1d4a518cd0afc05dd75246d71ca016d8f8aa918ba3ec452ba92b865137afe054  /tmp/ps3dev.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ps3dev.tar.gz -C /opt/ps3dev --strip-components=1
          echo "PS3DEV=/opt/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=/opt/ps3dev" >> "$GITHUB_ENV"
          echo "/opt/ps3dev/bin" >> "$GITHUB_PATH"
          echo "/opt/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "/opt/ps3dev/spu/bin" >> "$GITHUB_PATH"
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=/opt/ps3dev
          export PATH="/opt/ps3dev/bin:/opt/ps3dev/ppu/bin:/opt/ps3dev/spu/bin:$PATH"
          test -s /opt/ps3dev/ppu/lib/librsx.a
          command -v ppu-gcc
          command -v cgcomp
          command -v fself
          command -v sfo
          command -v pkg

      - name: Install NVIDIA Cg Toolkit runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /opt/cg /tmp/cg-package /tmp/cg.tgz
          sudo mkdir -p /opt/cg
          sudo chown "$USER:$USER" /opt/cg
          curl -fL --retry 10 --retry-all-errors --retry-delay 2 \
            -o /tmp/cg.tgz \
            https://developer.download.nvidia.com/cg/Cg_3.1/Cg-3.1_April2012_x86_64.tgz
          tar -xzf /tmp/cg.tgz -C /opt/cg
          CGC="$(find /opt/cg -type f -name cgc -perm -111 | head -n1)"
          CG_LIB_FILE="$(find /opt/cg -type f -name 'libCg.so' ! -path '*/Trace/*' ! -path '*/trace/*' | head -n1)"
          if [ -z "$CG_LIB_FILE" ]; then
            CG_LIB_FILE="$(find /opt/cg -type f -name 'libCg.so.*' ! -path '*/Trace/*' ! -path '*/trace/*' | head -n1)"
          fi
          test -n "$CGC"
          test -n "$CG_LIB_FILE"
          CG_LIB="$(dirname "$CG_LIB_FILE")"
          sudo ln -sf "$CG_LIB_FILE" /usr/lib/libCg.so
          sudo ldconfig
          echo "$(dirname "$CGC")" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib:$CG_LIB:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          export PATH="$(dirname "$CGC"):$PATH"
          export LD_LIBRARY_PATH="/usr/lib:$CG_LIB:${LD_LIBRARY_PATH:-}"
          test -e /usr/lib/libCg.so
          command -v cgc

      - name: Build EBOOT and PKG
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT"
          timeout 30m bash tools/build.sh
          test -s poppy_ps3.elf
          timeout 10m bash tools/package.sh
          test -s dist/app_home/USRDIR/EBOOT.BIN
          test -s dist/app_home/PARAM.SFO
          test -s dist/app_home/ICON0.PNG
          test -s dist/app_home/PIC1.PNG
          test -s dist/app_home/USRDIR/data/menu_bg.raw
          test -s dist/app_home/USRDIR/data/chapter_bg.raw
          test -s dist/app_home/USRDIR/data/font.raw
          test -s dist/PoppyPlaytime_Capitulo1_PS3.pkg
          APP_BYTES="$(du -sb dist/app_home | cut -f1)"
          PKG_BYTES="$(stat -c '%s' dist/PoppyPlaytime_Capitulo1_PS3.pkg)"
          echo "app_home=$APP_BYTES bytes"
          echo "pkg=$PKG_BYTES bytes"
          test "$APP_BYTES" -gt 7000000
          test "$PKG_BYTES" -gt 1000000
          stat -c '%s bytes  %n' dist/app_home/USRDIR/EBOOT.BIN dist/PoppyPlaytime_Capitulo1_PS3.pkg

      - name: Upload PKG and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PoppyPlaytime-PS3-build
          if-no-files-found: warn
          path: |
            /tmp/poppy-source/**/dist/**
            /tmp/poppy-source/**/poppy_ps3.elf
            /tmp/poppy-source/**/build/**
