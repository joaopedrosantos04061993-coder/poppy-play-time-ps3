          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <malloc.h>
          #include <rsx/rsx.h>
          #include <sysutil/video.h>
          #include <io/pad.h>
          #include <tiny3d.h>

          static u32 *frame_buffers[2] = {NULL, NULL};
          static u32 frame_pitch = 0;
          static u32 screen_w = 1280;
          static u32 screen_h = 720;
          static int current_fb = 0;
          static gcmContextData *gcm_ctx = NULL;
          static void *host_addr = NULL;

          static int init_video(void) {
              host_addr = memalign(1024 * 1024, 1024 * 1024);
              if (!host_addr) return -1;
              if (rsxInit(&gcm_ctx, 64 * 1024, 1024 * 1024, host_addr) != 0) return -2;

              videoState state;
              if (videoGetState(0, 0, &state) != 0) return -3;

