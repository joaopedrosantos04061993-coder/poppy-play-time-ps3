name: Build Poppy Playtime PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Extrair o zip
        run: |
          for z in PoppyPlaytimePS3*.zip *.zip; do
            if [ -f "$z" ] && [[ "$z" != *"GitHub"* ]]; then
              unzip -q -o "$z"
            fi
          done

      - name: Criar script de build
        run: |
          cat > build.sh <<'EOF'
          set -e
          : "${PS3DEV:=/usr/local/ps3dev}"; export PS3DEV
          export PSL1GHT="$PS3DEV/ppu"
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"

          WORK_DIR="$PWD"
          if [ -d "PoppyPlaytimePS3" ]; then
            cd PoppyPlaytimePS3
            WORK_DIR="$PWD"
          elif [ -d "PoppyPlaytimePS3_FACTORY_ASSETS_stage1" ]; then
            cd PoppyPlaytimePS3_FACTORY_ASSETS_stage1
            WORK_DIR="$PWD"
          fi

          mkdir -p src data/native_assets build/pkg_dir/USRDIR

          if [ -d "factory_portable_opt" ]; then
            cp -r factory_portable_opt/. data/native_assets/
          fi
          if [ -d "factory_portable" ]; then
            cp -r factory_portable/. data/native_assets/
          fi
          if [ -f "src_opt/factory_fluid_loader.c" ]; then
            cp src_opt/factory_fluid_loader.c src/factory_fluid_loader.c
          fi

          if [ ! -f "src/main.c" ]; then
            cat > src/main.c <<'MAIN_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <malloc.h>
          #include <rsx/rsx.h>
          #include <sysutil/video.h>
          #include <io/pad.h>
          #include <tiny3d.h>

          static u32 *frame_buffers[2] = {NULL, NULL};
          static u32 frame_pitch = 0;
          static u32 screen_w = 1280;
          static u32 screen_h = 720;
          static int current_fb = 0;
          static gcmContextData *gcm_ctx = NULL;
          static void *host_addr = NULL;

          static int init_video(void) {
              host_addr = memalign(1024 * 1024, 1024 * 1024);
              if (!host_addr) return -1;
              if (rsxInit(&gcm_ctx, 64 * 1024, 1024 * 1024, host_addr) != 0) return -2;

              videoState state;
              if (videoGetState(0, 0, &state) != 0) return -3;

              videoResolution res;
              u16 res_id = VIDEO_RESOLUTION_720;
              if (videoGetResolution(res_id, &res) != 0) {
                  res_id = VIDEO_RESOLUTION_480;
                  if (videoGetResolution(res_id, &res) != 0) {
                      return -4;
                  }
              }

              screen_w = res.width;
              screen_h = res.height;

              videoConfiguration vconfig;
              memset(&vconfig, 0, sizeof(vconfig));
              vconfig.resolution = res_id;
              vconfig.format = VIDEO_BUFFER_FORMAT_XRGB;
              vconfig.pitch = res.width * 4;
              vconfig.aspect = VIDEO_ASPECT_16_9;

              if (videoConfigure(0, &vconfig, NULL, 0) != 0) return -5;

              frame_pitch = vconfig.pitch;
              u32 fb_size = frame_pitch * res.height;

              for (int i = 0; i < 2; i++) {
                  frame_buffers[i] = (u32 *)rsxMemalign(64, fb_size);
                  if (!frame_buffers[i]) return -6;
                  memset(frame_buffers[i], 0x20, fb_size);
                  u32 offset = 0;
                  rsxAddressToOffset(frame_buffers[i], &offset);
                  gcmSetDisplayBuffer((u8)i, offset, frame_pitch, res.width, res.height);
              }

              gcmSetFlipMode(GCM_FLIP_VSYNC);
              return 0;
          }

          int main(void) {
              ioPadInit(7);
              int vid_ok = (init_video() == 0);
              u32 tick = 0;

              while (1) {
                  padInfo padinfo;
                  padData paddata;
                  ioPadGetInfo(&padinfo);
                  for (int i = 0; i < MAX_PADS; i++) {
                      if (padinfo.status[i]) {
                          ioPadGetData(i, &paddata);
                          if (paddata.button[PAD_BUTTON_OFFSET_DIGITAL2] & PAD_CTRL_START) {
                              goto done;
                          }
                      }
                  }

                  if (vid_ok && frame_buffers[current_fb]) {
                      u32 *fb = frame_buffers[current_fb];
                      u32 stride = frame_pitch / 4;
                      for (u32 y = 0; y < screen_h; y++) {
                          u32 color = (y < screen_h / 8) ? 0xFF1E8E3E : 0xFF202630;
                          for (u32 x = 0; x < screen_w; x++) {
                              fb[y * stride + x] = color;
                          }
                      }
                      u32 box_x = (tick * 8) % (screen_w > 64 ? screen_w - 64 : 1);
                      for (u32 y = screen_h / 4; y < screen_h / 4 + 48 && y < screen_h; y++) {
                          for (u32 x = box_x; x < box_x + 48 && x < screen_w; x++) {
                              fb[y * stride + x] = 0xFFF9AB00;
                          }
                      }
                      gcmSetFlip(gcm_ctx, current_fb);
                      rsxFlushBuffer(gcm_ctx);
                      gcmSetWaitFlip(gcm_ctx);
                      current_fb ^= 1;
                  }

                  tick++;
                  usleep(16666);
              }

          done:
              ioPadEnd();
              return 0;
          }
          MAIN_EOF
          fi

          if [ ! -f "Makefile" ] && [ ! -f "Makefile.ps3" ]; then
            cat > Makefile <<'MK_EOF'
          PS3DEV ?= /usr/local/ps3dev
          PSL1GHT ?= $(PS3DEV)/ppu
          PORTLIBS ?= $(PS3DEV)/portlibs/ppu

          CC := $(PSL1GHT)/bin/ppu-gcc
          STRIP := $(PSL1GHT)/bin/ppu-strip
          MAKE_SELF ?= make_self

          TITLE_ID ?= POPT00001
          BUILD_DIR := build
          PKG_ROOT := $(BUILD_DIR)/pkg_dir
          USRDIR := $(PKG_ROOT)/USRDIR
          ASSETS_SRC := data/native_assets

          TARGET_ELF := $(BUILD_DIR)/$(TITLE_ID).elf
          TARGET_SELF := $(USRDIR)/EBOOT.BIN
          TARGET_PKG := $(BUILD_DIR)/$(TITLE_ID)_PS3.pkg

          CFLAGS := -O2 -Wall -Wextra -mcpu=cell -I$(PSL1GHT)/include -I$(PORTLIBS)/include -Isrc
          LDFLAGS := -L$(PSL1GHT)/lib -L$(PORTLIBS)/lib
          LIBS := $(TINY3D_LIB) -lrsx -lgcm_sys -lsysutil -lio -lm -lc $(EXTRA_LIBS)

          SRCS := $(wildcard src/*.c)
          OBJS := $(patsubst src/%.c,$(BUILD_DIR)/%.o,$(SRCS))

          all: pkg

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: src/%.c | $(BUILD_DIR)
          	@mkdir -p $(dir $@)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(TARGET_ELF): $(OBJS)
          	$(CC) $(CFLAGS) $(OBJS) $(LDFLAGS) $(LIBS) -o $@

          prepare_assets:
          	@mkdir -p $(USRDIR)
          	@if [ -d "$(ASSETS_SRC)" ]; then \
          		mkdir -p "$(USRDIR)/assets"; \
          		cp -r "$(ASSETS_SRC)/." "$(USRDIR)/assets/"; \
          	fi

          $(TARGET_SELF): $(TARGET_ELF) prepare_assets
          	$(STRIP) -s $(TARGET_ELF) -o $(BUILD_DIR)/stripped.elf
          	@if command -v $(MAKE_SELF) >/dev/null 2>&1; then \
          		$(MAKE_SELF) $(BUILD_DIR)/stripped.elf $(TARGET_SELF); \
          	else \
          		cp $(BUILD_DIR)/stripped.elf $(TARGET_SELF); \
          	fi

          pkg: $(TARGET_SELF)
          	@if command -v pkg.py >/dev/null 2>&1; then \
          		pkg.py $(PKG_ROOT) $(TARGET_PKG); \
          	elif command -v make_package_npdrm >/dev/null 2>&1; then \
          		make_package_npdrm package.conf $(PKG_ROOT) || true; \
          	else \
          		echo "AVISO: ferramenta de PKG nao encontrada na imagem; artefatos em $(PKG_ROOT)"; \
          	fi
          MK_EOF
          fi

          PL="$PS3DEV/portlibs/ppu/lib"
          TINY3D_LIB=""
          if [ -f "$PL/libtiny3d.a" ]; then
            TINY3D_LIB="-ltiny3d"
          fi
          EXTRA=""
          for L in vorbisfile vorbis ogg FLAC mpg123 modplug mikmod; do
            if [ -f "$PL/lib$L.a" ]; then EXTRA="$EXTRA -l$L"; fi
          done
          echo "TINY3D_LIB=$TINY3D_LIB EXTRA_LIBS=$EXTRA"

          if [ -f "Makefile.ps3" ]; then
            make -f Makefile.ps3 TINY3D_LIB="$TINY3D_LIB" EXTRA_LIBS="$EXTRA" -k 2>&1 | tail -n 150
          else
            make pkg TINY3D_LIB="$TINY3D_LIB" EXTRA_LIBS="$EXTRA" -k 2>&1 | tail -n 150
          fi

          mkdir -p "$WORK_DIR/dist"
          find "$WORK_DIR" -maxdepth 4 -name "*.pkg" -exec cp {} "$WORK_DIR/dist/" \;
          ls -la "$WORK_DIR/dist" || true
          EOF

      - name: Compilar dentro da imagem ps3dev com SDL2
        run: docker run --rm -v "$PWD":/build -w /build hldtux/ps3dev-sdl2:latest sh build.sh

      - name: Enviar o .pkg
        uses: actions/upload-artifact@v4
        with:
          name: PoppyPlaytimePS3-pkg
          path: dist/*.pkg
          if-no-files-found: warn
